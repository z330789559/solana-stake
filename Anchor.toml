[toolchain]
anchor_version = "0.30.1"    # `anchor-cli` version to use(requires `avm`)
solana_version = "1.18.17"   # Solana version to use

[features]
seeds = true
skip-lint = false

[programs.localnet]
anchor-token = "6EGLSq5shhzLiavFRKPLQtQxLuyqfcnypjih9ENJLGTe"
[programs.devnet]
anchor-token = "6EGLSq5shhzLiavFRKPLQtQxLuyqfcnypjih9ENJLGTe"


[test.validator]
url = "https://api.mainnet-beta.solana.com"     # This is the url of the cluster that accounts are cloned from (See `test.validator.clone`).
#warp_slot = "1337"                                # Warp the ledger to `warp_slot` after starting the validator.
#slots_per_epoch = "32"                            # Override the number of slots in an epoch. # Set JSON RPC on this port, and the next port for the RPC websocket.
#limit_ledger_size = "1337"                        # Keep this amount of shreds in root slots.
#ledger = "test-ledger"                          # Set ledger location.
#gossip_port = 1338                            # Gossip port number for the validator.
#gossip_host = "127.0.0.1"                       # Gossip DNS name or IP address for the validator to advertise in gossip.
#faucet_sol = "1337"                              # Give the faucet address this much SOL in genesis.
#faucet_port = 1337                             # Enable the faucet on this port.
#dynamic_port_range = "1337-13337"             # Range to use for dynamically assigned ports.
#bind_address = "0.0.0.0"
[[test.validator.clone]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s" # token-metadata
#
#[[test.genesis]]
#address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
#program = "tests/metaplex_token_metadata_program.so"

[workspace]
types = "app/src/idl/"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "./tests/deploy.json"


[scripts]
#test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
test="ts-mocha -n loader=ts-node/esm -p tsconfig.json  -t 1000000  tests/**/*.ts"
test_collect = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 --grep  'create_nft_collect' tests/anchor-token.ts"
test_mint_nft = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 --grep  'mint_nft' tests/anchor-token.ts"

